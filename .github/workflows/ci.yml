name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Tests (fuzzing, crash recovery, isolation, JDBC), psql, benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew test --console=plain
      - name: Talk to it with psql
        run: |
          ./gradlew installDist --console=plain
          build/install/simpan/bin/simpan serve --port 5433 /tmp/simpan-psql &
          for i in $(seq 1 30); do pg_isready -h localhost -p 5433 && break; sleep 1; done
          psql -h localhost -p 5433 -U simpan -d simpan -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE kopi (id int PRIMARY KEY, name text NOT NULL, price double precision);
          INSERT INTO kopi VALUES (1, 'Kopi O', 1.8), (2, 'Teh Tarik', 2.5), (3, 'Milo Ais', 3.2);
          SELECT name, price FROM kopi WHERE price > 2 ORDER BY price DESC;
          BEGIN;
          UPDATE kopi SET price = price + 0.2 WHERE id = 2;
          COMMIT;
          EXPLAIN ANALYZE SELECT * FROM kopi WHERE id = 2;
          SQL
      - name: Benchmark (200,000 rows)
        run: build/install/simpan/bin/simpan bench 200000 /tmp/simpan-bench | tee -a "$GITHUB_STEP_SUMMARY"
